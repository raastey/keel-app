[package]
name = "keel"
version = "0.1.0"
description = "Local-first AI workspace with inspectable memory"
authors = ["SIXTWELVE"]
edition = "2024"
rust-version = "1.85"

[lib]
name = "keel_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "keel"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10.9"
tauri = { version = "2.11.5", features = [] }
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["io-util", "process", "sync", "time"] }
uuid = { version = "1.24.0", features = ["v4", "serde"] }
walkdir = "2.5.0"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.7.0"

[dev-dependencies]
tempfile = "3.27.0"
